<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SCT 本地控制台</title>
  <style>
    body { font-family: "Microsoft YaHei", system-ui, sans-serif; max-width: 860px;
           margin: 32px auto; padding: 0 16px; color: #24292f; }
    h1 { font-size: 22px; }
    pre { background: #f6f8fa; padding: 12px; border-radius: 6px; overflow: auto;
          max-height: 320px; }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 13px;
             vertical-align: middle; }
    .ok { background: #dafbe1; color: #1a7f37; }
    .err { background: #ffebe9; color: #cf222e; }
    button { font-size: 14px; padding: 6px 14px; cursor: pointer; }
    section { margin: 20px 0; }
    table { border-collapse: collapse; font-size: 13px; }
    td, th { border: 1px solid #d8dee4; padding: 4px 8px; }
  </style>
</head>
<body>
  <h1>SCT · 系统化骑行训练系统 <span id="health" class="badge">…</span></h1>
  <p>M1 数据链路本地控制台：凭据状态 · 活动同步 · 同步日志。密钥仅掩码展示。</p>

  <section>
    <h2>凭据 / 连接</h2>
    <button id="credBtn" onclick="loadCred()">刷新凭据状态</button>
    <pre id="credJson">点击按钮查询…</pre>
  </section>

  <section>
    <h2>活动数据同步（intervals.icu → 本地镜像）</h2>
    <button id="syncBtn" onclick="runSync()">同步最近 90 天活动</button>
    <button onclick="loadStatus()">刷新同步日志</button>
    <pre id="syncJson">…</pre>
  </section>

  <section>
    <h2>最近同步日志</h2>
    <table id="logTable">
      <thead><tr><th>#</th><th>窗口</th><th>状态</th><th>抓取</th><th>新增</th><th>更新</th><th>未变</th><th>时间</th></tr></thead>
      <tbody></tbody>
    </table>
    <pre id="errJson"></pre>
  </section>

  <script>
    const $ = (id) => document.getElementById(id);
    async function fetchText(url, options) {
      const r = await fetch(url, options);
      const text = await r.text();
      if (!r.ok) throw new Error(`HTTP ${r.status}: ${text}`);
      return text;
    }
    async function showJson(url, target, options) {
      try { $(target).textContent = await fetchText(url, options); }
      catch (e) { $(target).textContent = String(e); }
    }
    async function loadHealth() {
      try {
        const body = JSON.parse(await fetchText("/api/health"));
        const ok = body.status === "ok";
        const badge = $("health");
        badge.textContent = ok ? "运行中" : "异常";
        badge.className = "badge " + (ok ? "ok" : "err");
      } catch (e) { $("health").textContent = "离线"; $("health").className = "badge err"; }
    }
    function loadCred() { showJson("/api/credentials/status", "credJson"); }
    async function runSync() {
      $("syncBtn").disabled = true;
      $("syncJson").textContent = "同步中…";
      try {
        const text = await fetchText("/api/sync/activities", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
        $("syncJson").textContent = text;
        await loadStatus();
      } catch (e) { $("syncJson").textContent = String(e); }
      finally { $("syncBtn").disabled = false; }
    }
    async function loadStatus() {
      try {
        const body = JSON.parse(await fetchText("/api/sync/status"));
        const tbody = $("logTable").querySelector("tbody");
        tbody.innerHTML = "";
        for (const log of body.recent) {
          const tr = document.createElement("tr");
          const cell = (v) => { const td = document.createElement("td"); td.textContent = v ?? ""; return td; };
          const win = log.window ? `${log.window.oldest} ~ ${log.window.newest}` : "";
          tr.append(cell(log.id), cell(win), cell(log.status), cell(log.fetched),
                     cell(log.inserted), cell(log.updated), cell(log.unchanged),
                     cell(log.finished_at || log.started_at));
          tbody.append(tr);
        }
        $("errJson").textContent = "";
      } catch (e) { $("errJson").textContent = String(e); }
    }
    loadHealth(); loadCred(); loadStatus();
  </script>
</body>
</html>
