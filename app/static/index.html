<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SCT 启动页</title>
  <style>
    body { font-family: "Microsoft YaHei", system-ui, sans-serif; max-width: 720px;
           margin: 48px auto; padding: 0 16px; color: #24292f; }
    h1 { font-size: 24px; }
    pre { background: #f6f8fa; padding: 12px; border-radius: 6px; overflow: auto; }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 13px; }
    .ok { background: #dafbe1; color: #1a7f37; }
  </style>
</head>
<body>
  <h1>SCT · 系统化骑行训练系统 <span id="health" class="badge">…</span></h1>
  <p>骨架已启动（M1-1）。下方为 API 探活与凭据状态（密钥仅掩码展示）。</p>
  <h2>/api/health</h2>
  <pre id="healthJson">loading…</pre>
  <h2>/api/credentials/status</h2>
  <pre id="credJson">loading…</pre>
  <script>
    async function getJson(url) {
      const r = await fetch(url);
      return { status: r.status, body: await r.text() };
    }
    (async () => {
      const h = await getJson("/api/health");
      document.getElementById("healthJson").textContent = h.body;
      const ok = h.status === 200 && (JSON.parse(h.body).status === "ok");
      const badge = document.getElementById("health");
      badge.textContent = ok ? "运行中" : "异常";
      badge.classList.add(ok ? "ok" : "");
      const c = await getJson("/api/credentials/status");
      document.getElementById("credJson").textContent = c.body;
    })().catch((e) => {
      document.getElementById("healthJson").textContent = String(e);
    });
  </script>
</body>
</html>
